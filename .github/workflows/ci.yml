# CI-QUALITY-GATES-1 — pull request checks for apps/dashboard.
#
# Security boundary (pinned by tests/ci-quality-gates-1/workflow-firewall.ts):
#   - pull_request only; pull_request_target is never used, so a fork's code never runs with write
#     access or secrets.
#   - The token can read contents and nothing else. No secret, no environment, no deployment.
#   - The only database is the disposable service container below, reachable on the runner's
#     loopback. No production or staging connection exists to reach.
#   - Third-party actions are pinned to full commit SHAs; the service image is pinned by digest.
#
# quick   — the gate: typecheck, lint, production build, continuity and workflow checks. Fails the run.
# suite   — informational: the full test suite on a disposable PostgreSQL. continue-on-error, so a
#           red suite is visible on the pull request but does not fail the run. Files named in
#           apps/dashboard/scripts/ci/suite-exclusions.json are not run and are never counted as passes.

name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash
    working-directory: apps/dashboard

jobs:
  quick:
    name: quick (typecheck, lint, build, continuity)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Production build
        run: npx next build

      - name: Development continuity
        run: node --import tsx tests/development-continuity/closure-contract.ts

      - name: CI workflow and exclusion manifest
        run: node --import tsx tests/ci-quality-gates-1/workflow-firewall.ts

  suite:
    name: suite (informational, disposable PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEBUN_TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
      # The suite starts the Python media store; bytecode caches would dirty the tree the last step checks.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: several tests read earlier commits with git diff / git show.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install PostgreSQL 18 client tools and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18 ffmpeg
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          pg_dump --version
          psql --version
          ffmpeg -version | head -1
          psql "$HEBUN_TEST_ADMIN_DATABASE_URL" -Atc "select version(), datcollate from pg_database where datname = 'postgres'"

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full suite with exclusion manifest
        run: node scripts/run-tests.mjs --exclude-manifest scripts/ci/suite-exclusions.json

      - name: Tree unchanged after the suite
        if: always()
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
